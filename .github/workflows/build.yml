name: Build APK + IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    name: Sesleri üret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet edge-tts gTTS
      - uses: actions/cache@v4
        with:
          path: assets/audio
          key: audio-${{ hashFiles('src/data/**/*.json', 'scripts/generate_audio.py') }}
          restore-keys: audio-
      - run: python scripts/generate_audio.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio
          path: |
            assets/audio
            src/audio/audioMap.ts
          retention-days: 3

  android:
    name: Android APK
    needs: audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx expo install --fix
      - name: Type check (bilgi amaçlı)
        run: npx tsc --noEmit
        continue-on-error: true
      - run: npx expo prebuild --platform android --no-install
      - name: Sabit imza anahtarı (güncellemeler veri silmeden kurulsun)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/debug.keystore
            echo "Kalıcı imza anahtarı kullanılıyor"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret yok — geçici anahtar kullanılıyor"
          fi
      - name: Gradle build
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk Rusca-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Rusca-${{ github.run_number }}.apk
          retention-days: 14

  ios:
    name: iOS IPA (imzasız)
    needs: audio
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --fix
      - run: npx expo prebuild --platform ios
      - name: Xcode archive (imzasız)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS scheme=$SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 80
      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry Rusca-${{ github.run_number }}.ipa Payload
          ls -lh Rusca-*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Rusca-${{ github.run_number }}.ipa
          retention-days: 14

  release:
    name: Release yayınla
    needs: [android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rusça · sürüm ${{ github.run_number }}
          make_latest: true
          files: |
            out/*.apk
            out/*.ipa
          body: |
            **Android:** `.apk` dosyasını telefona indirip aç ve kur. Güncellemeler üstüne kurulur, ilerleme silinmez.

            **iPhone:** `.ipa` dosyasını Sideloadly / AltStore ile kendi Apple ID'nle yükle. 7 günde bir yeniden yüklemeden önce Ayarlar → Yedek → **Yedeği paylaş**.
