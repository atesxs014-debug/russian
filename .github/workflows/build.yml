name: Voxa build (APK + IPA)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    name: Sesleri üret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet edge-tts gTTS
      - name: ffmpeg (ses sıkıştırma)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Dilbilgisi paketleri güncel mi?
        run: python scripts/build_grammar.py && git diff --exit-code src/data/grammar || (echo "::error::content/grammar değişmiş ama src/data/grammar yeniden üretilmemiş" && exit 1)
      - uses: actions/cache@v4
        with:
          path: assets/audio
          key: audio-${{ hashFiles('src/data/**/*.json', 'scripts/generate_audio.py') }}
          restore-keys: audio-
      - run: python scripts/generate_audio.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio
          path: |
            assets/audio
            src/audio/audioMap.ts
          retention-days: 3

  android:
    name: Android APK
    needs: audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Sürüm numarasını göm
        run: sed -i.bak "s/export const BUILD = 0;/export const BUILD = ${{ github.run_number }};/" src/buildInfo.ts && cat src/buildInfo.ts
      - name: Whisper modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: assets/models
          key: whisper-ggml-base-v1
      - name: Whisper modelini indir (ggml-base, ~148 MB)
        run: |
          mkdir -p assets/models
          if [ ! -s assets/models/ggml-base.bin ]; then
            curl -fL --retry 3 -o assets/models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          fi
          ls -lh assets/models
      - run: npm install --no-audit --no-fund
      - run: npx expo install --fix
      - name: Type check (bilgi amaçlı)
        run: |
          npx tsc --noEmit > "$RUNNER_TEMP/tsc.log" 2>&1 || python3 scripts/ci_annotate.py "$RUNNER_TEMP/tsc.log" warning TypeScript "error TS"
        continue-on-error: true
      - name: Modül teşhisi
        run: |
          {
            npm ls expo-modules-autolinking expo-modules-core expo 2>&1 | head -40
            for f in node_modules/*/expo-module.config.json node_modules/@*/*/expo-module.config.json; do
              if grep -q publication "$f" 2>/dev/null; then
                d=$(dirname "$f"); echo "PUB $d v$(node -p "require('./$d/package.json').version") :: $(tr -d '\n ' < "$f" | head -c 400)"
              fi
            done
          } > "$RUNNER_TEMP/diag.log" 2>&1
          python3 scripts/ci_annotate.py "$RUNNER_TEMP/diag.log" warning Diag '.'
      - run: npx expo prebuild --platform android --no-install
      - name: Sabit imza anahtarı (güncellemeler veri silmeden kurulsun)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/debug.keystore
            echo "Kalıcı imza anahtarı kullanılıyor"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret yok — geçici anahtar kullanılıyor"
          fi
      - name: Gradle build
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Gradle hata özeti
        if: failure()
        run: |
          python3 scripts/ci_annotate.py "$RUNNER_TEMP/gradle.log" error Gradle 'What went wrong|error:|e: file|FAILED|Could not|Unresolved|Caused by'
      - run: cp android/app/build/outputs/apk/release/app-release.apk Voxa-${{ github.run_number }}.apk
      - name: İmza parmak izi
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          FP=$($AS verify --print-certs Voxa-${{ github.run_number }}.apk | grep -m1 'SHA-256' | awk '{print $NF}')
          echo "::notice title=APK imzası::SHA-256 $FP"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Voxa-${{ github.run_number }}.apk
          retention-days: 14

  ios:
    name: iOS IPA (imzasız)
    needs: audio
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audio
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sürüm numarasını göm
        run: sed -i.bak "s/export const BUILD = 0;/export const BUILD = ${{ github.run_number }};/" src/buildInfo.ts && cat src/buildInfo.ts
      - name: Whisper modelini önbellekten al
        uses: actions/cache@v4
        with:
          path: assets/models
          key: whisper-ggml-base-v1
      - name: Whisper modelini indir (ggml-base, ~148 MB)
        run: |
          mkdir -p assets/models
          if [ ! -s assets/models/ggml-base.bin ]; then
            curl -fL --retry 3 -o assets/models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          fi
          ls -lh assets/models
      - run: npm install --no-audit --no-fund
      - run: npx expo install --fix
      - name: Expo prebuild (iOS)
        run: |
          set -o pipefail
          npx expo prebuild --platform ios 2>&1 | tee "$RUNNER_TEMP/prebuild.log"
      - name: Prebuild hata özeti
        if: failure()
        run: |
          python3 scripts/ci_annotate.py "$RUNNER_TEMP/prebuild.log" error Prebuild
      - name: Xcode archive (imzasız)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS scheme=$SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/xcode.log" 2>&1
      - name: Xcode hata özeti
        if: failure()
        run: |
          python3 scripts/ci_annotate.py "$RUNNER_TEMP/xcode.log" error Xcode 'error:|fatal|FAILED|failed'
      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry Voxa-${{ github.run_number }}.ipa Payload
          ls -lh Voxa-*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Voxa-${{ github.run_number }}.ipa
          retention-days: 14

  release:
    name: Release yayınla
    needs: [android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Sabit isimli kopyalar (latest linki için)
        run: |
          for f in out/Voxa-*.apk; do [ -e "$f" ] && cp "$f" out/Voxa.apk; done
          for f in out/Voxa-*.ipa; do [ -e "$f" ] && cp "$f" out/Voxa.ipa; done
          ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Voxa · sürüm ${{ github.run_number }}
          make_latest: true
          files: |
            out/*.apk
            out/*.ipa
          fail_on_unmatched_files: false
          body: |
            **Android:** `.apk` dosyasını telefona indirip aç ve kur. Güncellemeler üstüne kurulur, ilerleme silinmez.

            **iPhone:** `.ipa` dosyasını Esign / Feather ile imzalayıp yükle. Yeniden yüklemeden önce Ayarlar → Yedek → **Yedeği paylaş**.
